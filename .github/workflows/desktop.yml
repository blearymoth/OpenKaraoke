# The desktop app for Linux (desktop/): every change to the app on main is tested, built
# (OpenKaraoke-Setup.zip — the one download for everybody —, AppImage, .rpm, .deb), tested again
# as the built app and as the real setup, and published as the latest GitHub release. The README
# links to releases/latest/download/OpenKaraoke-Setup.zip; the app's updater
# (desktop/updater.mjs) follows the latest release.
#   Version: major.minor from package.json, then this workflow's run number (0.1.42, 0.1.43, …).
#   Only the 10 newest releases are kept (the installers are about 100 MB each).
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'shared/**'
      - 'desktop/**'
      - 'package.json'
      - 'LICENSE'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a newer push waits (and replaces any older one still waiting).
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the previous release's tag, for the release notes

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Tests
        timeout-minutes: 10
        run: npm test

      - name: Version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb

      - name: Electron and electron-builder
        run: npm ci --prefix desktop

      - name: Installers
        timeout-minutes: 20
        env:
          OPENKARAOKE_VERSION: ${{ steps.version.outputs.version }}
        run: npm --prefix desktop run dist

      - name: Test the built app
        timeout-minutes: 10
        env:
          APP: desktop/dist/linux-unpacked/openkaraoke
        run: |
          npm install --global playwright-core@1.56.1
          npm --prefix desktop test

      - name: Test the setup (the real AppImage from OpenKaraoke-Setup.zip)
        timeout-minutes: 10
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # no FUSE needed on the runner
          NO_CLEANUP: '1' # two copies of the same AppImage share the folder it is unpacked to
        run: |
          unzip -q -o desktop/dist/OpenKaraoke-Setup.zip -d desktop/dist/setup
          test -x "desktop/dist/setup/Install OpenKaraoke"
          SETUP_APPIMAGE="desktop/dist/setup/Install OpenKaraoke" node desktop/test/setup.mjs

      - name: Checksums
        working-directory: desktop/dist
        run: sha256sum OpenKaraoke-Setup.zip OpenKaraoke-*.AppImage openkaraoke-*.rpm openkaraoke_*.deb | tee SHA256SUMS

      - name: Release notes
        run: |
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="-20"; fi
          git log --no-merges --format='* %s' $range > notes.md
          [ -s notes.md ] || echo '* Rebuilt.' > notes.md
          cat notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft first, published once every file is up: the updater never sees half a release.
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "OpenKaraoke $VERSION" --notes-file notes.md \
            desktop/dist/OpenKaraoke-Setup.zip desktop/dist/OpenKaraoke-*.AppImage desktop/dist/openkaraoke-*.rpm desktop/dist/openkaraoke_*.deb desktop/dist/SHA256SUMS
          gh release edit "v$VERSION" --draft=false --latest

      - name: Keep the 10 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
